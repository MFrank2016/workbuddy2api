name: AI Backend Probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GitHub Models inference (默认后端，仅诊断用)
        run: |
          set -uo pipefail
          echo "=== openai/gpt-4o @ models.github.ai ==="
          curl -sS -o /tmp/out.json -D /tmp/h.txt -w 'http=%{http_code} type=%{content_type}\n' \
            -X POST https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4o","messages":[{"role":"user","content":"reply with the single word OK"}],"max_tokens":10}'
          echo "--- body (max 300) ---"; head -c 300 /tmp/out.json; echo

      - name: Probe 自建端点（AI_BASE_URL / AI_API_KEY / AI_MODEL）
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          set -uo pipefail
          echo "base_url=${AI_BASE_URL:-（空）}  model=${AI_MODEL:-（空）}  key_len=${#AI_API_KEY}"
          echo "=== GET /models ==="
          curl -sS -o /tmp/m.json -w 'http=%{http_code} type=%{content_type}\n' \
            "$AI_BASE_URL/models" -H "Authorization: Bearer $AI_API_KEY"
          python3 - <<'PY' || head -c 200 /tmp/m.json
          import json, os
          d = json.load(open('/tmp/m.json'))
          ids = [m.get('id') for m in d.get('data', [])]
          print('models:', len(ids), '| contains_target:', os.environ.get('AI_MODEL') in ids)
          PY
          echo "=== POST /chat/completions ==="
          curl -sS -o /tmp/c.json -w 'http=%{http_code} type=%{content_type} time=%{time_total}s\n' \
            -X POST "$AI_BASE_URL/chat/completions" \
            -H "Authorization: Bearer $AI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"$AI_MODEL\",\"messages\":[{\"role\":\"system\",\"content\":\"You are terse.\"},{\"role\":\"user\",\"content\":\"Reply with exactly: SPAM\"}],\"max_tokens\":16,\"temperature\":0.1}"
          python3 - <<'PY' || head -c 400 /tmp/c.json
          import json
          d = json.load(open('/tmp/c.json'))
          ch = d.get('choices')
          print('choices_is_list:', isinstance(ch, list))
          print('content:', (ch[0].get('message') or {}).get('content') if isinstance(ch, list) and ch else None)
          print('model:', d.get('model'))
          PY
