services:
  wb2api:
    build:
      context: .
      args:
        # 可选：Go 模块代理。官方 proxy.golang.org 在中国大陆不可达 —— 构建第一步
        # 就是 `go mod download`，会长时间卡在这一层（看着像构建挂了），有时直接失败。
        # 国内构建填 https://goproxy.cn,direct（或 https://mirrors.aliyun.com/goproxy/）。
        # 留空 = 官方默认，行为与上游原版一致。
        GOPROXY: ""
    container_name: workbuddy2api
    restart: unless-stopped
    # 容器默认以 app 用户（uid 10001）运行。宿主机挂载目录属主不同会导致
    # 「写入 auths/*.json.tmp 失败 permission denied」，三种解法任选：
    #   1) 非 root · 让容器以你自己的 uid 运行（挂载目录本来就是你建的）：
    #      PUID=$(id -u) PGID=$(id -g) docker compose up -d
    #      或写进 .env 文件：PUID=1000 / PGID=1000
    #   2) sudo chown -R 10001:10001 ./auths ./data ./config.json
    #   3) user: "0:0" 以 root 运行（省事但容器逃逸面更大，自担）
    user: "${PUID:-10001}:${PGID:-10001}"
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    volumes:
      # auths 凭证卷：login.sh 在宿主机落盘 workbuddy-<uid>.json（0600），容器网关以
      # app(uid 10001) 读 + 回写（refresh / realm backfill 走 tmp+rename，需目录写权限）。
      # 跨 uid 部署（非 root 宿主落盘 / rootful 下宿主 uid≠10001）读不到 → 账号数为 0
      # （issue #108）。登录后把目录属主交给 10001（与 ./data 卷同口径）：
      #   chown -R 10001:10001 ./auths
      # 之后新增账号建议进容器登录（app 自身落盘，属主即 10001，免反复 chown；容器内无
      # docker CLI，完成后回宿主机重启）：
      #   docker compose exec -it wb2api bash -c './login.sh' && docker compose restart wb2api
      - ./auths:/app/auths
      # data 保持 bind mount（本地映射，与旧版本一致）。
      # 若容器内 app(uid 10001) 写 state.json 报 permission denied，宿主机执行：
      #   chown -R 10001:10001 ./data
      - ./data:/app/data
      # 注意：宿主机必须先有 config.json（cp config.example.json config.json）。
      # 缺失时 Docker 会把挂载点创建成目录 → 容器启动失败（程序会自动生成配置，
      # 但前提是它能以文件形式写入 —— 挂载目录会挡住这条路径）。
      # 不挂 :ro：面板「配置」页需要写回此文件（保存后热生效）。
      - ./config.json:/app/config.json
