services:
  wb2api:
    build:
      context: .
      args:
        # 可选：Go 模块代理。官方 proxy.golang.org 在中国大陆不可达 —— 构建第一步
        # 就是 `go mod download`，会长时间卡在这一层（看着像构建挂了），有时直接失败。
        # 国内构建填 https://goproxy.cn,direct（或 https://mirrors.aliyun.com/goproxy/）。
        # 留空 = 官方默认，行为与上游原版一致。
        GOPROXY: ""
    container_name: workbuddy2api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # 容器默认以 app 用户（uid 10001）运行。宿主机挂载目录属主不同会导致
    # 「写入 auths/*.json.tmp 失败 permission denied」，三种解法任选：
    #   1) 非 root · 让容器以你自己的 uid 运行（挂载目录本来就是你建的）：
    #      PUID=$(id -u) PGID=$(id -g) docker compose up -d
    #      或写进 .env 文件：PUID=1000 / PGID=1000
    #   2) sudo chown -R 10001:10001 ./auths ./data ./config.json
    #   3) user: "0:0" 以 root 运行（省事但容器逃逸面更大，自担）
    user: "${PUID:-10001}:${PGID:-10001}"
    # 覆盖 Dockerfile 的 ENTRYPOINT（那里写死 -config /app/config.json）：
    # 配置改从目录挂载里读，见 volumes 的说明。
    entrypoint: ["/app/wb2api", "-config", "/app/conf/config.json"]
    environment:
      - TZ=Asia/Shanghai
    # 默认只监听本机回环：公网统一走宿主机 Caddy（workbuddy2api.061995.xyz，
    # DNS-01 签证书）。本机脚本（login.sh / checkin.sh 等）仍用
    # http://127.0.0.1:7863 访问，不受影响。
    #
    # 需要从局域网直接访问时（例如脚本跑在另一台机器），在 .env 里设
    #   WB_UPSTREAM_BIND=0.0.0.0        # 或指定某块内网网卡地址
    # 而不要直接改这一行 —— 默认值保持「只绑回环」这条安全基线。
    # 注意：workbuddy-manager 的「更新上游」会保留本文件的定制（网络/卷/环境变量）。
    ports:
      - "${WB_UPSTREAM_BIND:-127.0.0.1}:7863:7863"
    networks:
      - default
      # 宿主机 Caddy 所在 compose 项目的网络（项目目录 /opt/caddy 时名为
      # caddy_caddy_net），Caddy 经容器名 workbuddy2api:7863 回源；GUI / 管理端
      # 也在此网络内直连本网关。
      #
      # ⚠️ 这条是**外部网络**：宿主机上必须已经存在同名网络，否则
      # `docker compose up` 会直接失败（network ... declared as external, but
      # could not be found）。两种处理：
      #   · 用 Caddy 反代：先 `docker network create caddy_caddy_net`（或由
      #     Caddy 的 compose 项目创建），网络名不同时用 CADDY_NETWORK 覆盖；
      #   · 不需要 Caddy：把下面这行连同 networks 段的 caddy_caddy_net 一起注释掉。
      - caddy_caddy_net
    volumes:
      # auths 凭证卷：login.sh 在宿主机落盘 workbuddy-<uid>.json（0600），容器网关以
      # app(uid 10001) 读 + 回写（refresh / realm backfill 走 tmp+rename，需目录写权限）。
      # 跨 uid 部署（非 root 宿主落盘 / rootful 下宿主 uid≠10001）读不到 → 账号数为 0
      # （issue #108）。登录后把目录属主交给 10001（与 ./data 卷同口径）：
      #   chown -R 10001:10001 ./auths
      # 之后新增账号建议进容器登录（app 自身落盘，属主即 10001，免反复 chown；容器内无
      # docker CLI，完成后回宿主机重启）：
      #   docker compose exec -it wb2api bash -c './login.sh' && docker compose restart wb2api
      - ./auths:/app/auths
      # data 保持 bind mount（本地映射，与旧版本一致）。
      # 若容器内 app(uid 10001) 写 state.json 报 permission denied，宿主机执行：
      #   chown -R 10001:10001 ./data
      - ./data:/app/data
      # 注意：宿主机必须先有 config.json（cp config.example.json config.json）。
      #
      # **挂目录，不要挂单个文件**（这里踩过两次坑）：
      #   · 单文件 bind mount 会把 inode 钉死。管理端在宿主上用 tmp+rename 原子替换
      #     配置后，容器仍读到**旧 inode** —— 表现为「配置改了但没生效」；
      #   · 同样因为挂的是挂载点，上游自己写盘时 rename 覆盖会返回 EBUSY
      #     （device or resource busy）。
      # 挂目录则宿主的改名/替换立刻可见，上游写盘也正常。config.json 就在仓库根，
      # 所以挂仓库根目录，并把 -config 指到 /app/conf/config.json（见 entrypoint）。
      - ./:/app/conf

networks:
  # 名称可用 CADDY_NETWORK 覆盖（不同宿主上 Caddy 的 compose 项目名可能不同）。
  caddy_caddy_net:
    external: true
    name: "${CADDY_NETWORK:-caddy_caddy_net}"
